id: P8DT01
title: 明确今天的流日：正午快照与现实小步
category: chart
clock: '2026-10-27T10:30:00+08:00'
targets:
- v4
seed:
  profile: default_synthetic
  synthetic: true
  profile_overrides:
    confirmed: true
    birth:
      date: '1994-03-12'
      time: 08:20
      solar_datetime: '1994-03-12T08:20:00'
      precision: exact
      clock_basis: clock
      location:
        lng: 104.07
        lat: 30.67
        tz: Asia/Shanghai
  controls:
    p8_acceptance:
      subject_id: synthetic-subject-ayuan
      revision: 1
      confirmed_fields:
      - birth.solar_datetime
      - birth.location.lng
      - birth.location.lat
      - birth.location.tz
      - birth.clock_basis
      - birth.precision
      - gender
      observer_contract: README.md#运行时观测约定
  incognito: false
turns:
- user: 阿远今天10月27日有面试，帮我看看今天流日，说明这是哪个时刻的快照。
  channel: web
  kind: chat
  expect:
    must_include_all:
    - 10月27日
    - 北京时间
    - '12:00'
    - 快照
    - 面试
    - 准备
    - 〔c
    - 〔r
    must_not_include:
    - 必然成功
    - 必然失败
    - 保证盈利
    - 吉日保证
    tools_not_called:
    - window_search
    - almanac
    - synastry
    tools_called:
    - daily_transit
    db:
    - path: p8_acceptance.engine_calls.daily_transit
      equals: 1
scripted:
- turn: 1
  model:
  - tool_call:
      name: daily_transit
      arguments:
        date: '2026-10-27'
  - result:
      ok: true
      mode: synthetic_scripted_observation_not_native_payload
  - db:
      p8_acceptance:
        engine_calls:
          daily_transit: 1
        long_term_writes: 0
  - text: 阿远，10月27日流日按北京时间12:00的快照看〔c1〕〔r1〕，不代表全天所有变化。面试先准备两段项目经历，提前确认路线，只作参考。
notes: 仅合成脚本回放，result与db是独立声明的观察，不是引擎或Agent执行证明；运行时目标须按README从真实调用/事务轨迹产生同名观察。出生资料来自阿远已确认档案，模型参数不得传birth或consent。
