id: P8AL02
title: 黄历不要求私人出生资料
category: chart
clock: '2026-10-27T10:30:00+08:00'
targets:
- v4
seed:
  profile: empty_profile
  synthetic: true
  profile_overrides: {}
  controls:
    p8_acceptance:
      subject_id: synthetic-subject-ayuan
      revision: 1
      confirmed_fields:
      - birth.solar_datetime
      - birth.location.lng
      - birth.location.lat
      - birth.location.tz
      - birth.clock_basis
      - birth.precision
      - gender
      observer_contract: README.md#运行时观测约定
  incognito: false
turns:
- user: 还没填生辰，只查2026年10月21日的黄历，可以吗？
  channel: web
  kind: chat
  expect:
    must_include_all:
    - 不需要出生资料
    - 北京时间
    - lunar-python
    - 〔c
    - 〔r
    must_not_include:
    - 必然成功
    - 必然失败
    - 保证盈利
    - 吉日保证
    tools_not_called:
    - daily_transit
    - window_search
    - synastry
    - profile_update_request
    - chart_compute
    tools_called:
    - almanac
    db:
    - path: p8_acceptance.engine_calls.almanac
      equals: 1
scripted:
- turn: 1
  model:
  - tool_call:
      name: almanac
      arguments:
        date: '2026-10-21'
  - result:
      ok: true
      mode: synthetic_scripted_observation_not_native_payload
  - db:
      p8_acceptance:
        engine_calls:
          almanac: 1
        long_term_writes: 0
  - text: 可以，黄历按北京时间的公历日查询，不需要出生资料；来源是lunar-python固定历法口径〔c1〕〔r1〕，不把出生真太阳时套到当天黄历。
notes: 仅合成脚本回放，result与db是独立声明的观察，不是引擎或Agent执行证明；运行时目标须按README从真实调用/事务轨迹产生同名观察。出生资料来自阿远已确认档案，模型参数不得传birth或consent。
