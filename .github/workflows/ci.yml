name: Core v3 checks
on: [push, pull_request]
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      (
        (github.head_ref == '' || github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.head_ref != '' || github.ref_type == 'branch') &&
        (
          (github.head_ref || github.ref_name) == 'v4/p3-agent-runtime' ||
          startsWith(github.head_ref || github.ref_name, 'v4/p3-wire-') ||
          startsWith(github.head_ref || github.ref_name, 'v4/p3-core-') ||
          startsWith(github.head_ref || github.ref_name, 'v4/p3-u4-') ||
          startsWith(github.head_ref || github.ref_name, 'v4/first-release-') ||
          startsWith(github.head_ref || github.ref_name, 'v4/p1b-') ||
          (github.head_ref || github.ref_name) == 'v4/integration'
        )
      ) && (github.head_ref || github.ref_name) || github.run_id
    }}
  cancel-in-progress: >-
    ${{
      (github.head_ref == '' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.head_ref != '' || github.ref_type == 'branch') &&
      (
        (github.head_ref || github.ref_name) == 'v4/p3-agent-runtime' ||
        startsWith(github.head_ref || github.ref_name, 'v4/p3-wire-') ||
        startsWith(github.head_ref || github.ref_name, 'v4/p3-core-') ||
        startsWith(github.head_ref || github.ref_name, 'v4/p3-u4-') ||
        startsWith(github.head_ref || github.ref_name, 'v4/first-release-') ||
        startsWith(github.head_ref || github.ref_name, 'v4/p1b-') ||
        (github.head_ref || github.ref_name) == 'v4/integration'
      )
    }}
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CORE_TEST_DSN: postgresql://core_test:isolated_ci_only@127.0.0.1:5432/core_test
      ZHIMING_TEST_DSN: postgresql://core_test:isolated_ci_only@127.0.0.1:5432/core_test
      ZHIMING_DATABASE_URL: postgresql://core_test:isolated_ci_only@127.0.0.1:5432/core_test
      MINGJING_TOKEN: isolated_ci_only
      KIMI_API_KEY: ""
      MOONSHOT_API_KEY: ""
      LANGSMITH_TRACING: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      FIRST_RELEASE_LOCAL_TEST_ADMIN_DSN: postgresql://first_release_test:isolated_fr_ci_only@127.0.0.1:55480/core_test_main
      FIRST_RELEASE_TEST_PG_BIN: /usr/lib/postgresql/15/bin
    steps:
      - uses: actions/checkout@v4
        with:
          # Offline B1 fixtures verify the exact historic b9 tree, not the current release.
          fetch-depth: 0
      - name: Start loopback PostgreSQL 15
        run: |
          docker run --detach --name p0-core-postgres --network host \
            -e POSTGRES_USER=core_test \
            -e POSTGRES_PASSWORD=isolated_ci_only \
            -e POSTGRES_DB=core_test \
            postgres:15 -c listen_addresses=127.0.0.1
          for attempt in {1..30}; do
            if docker exec p0-core-postgres pg_isready -h 127.0.0.1 -U core_test -d core_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 40 p0-core-postgres
          exit 1
      - name: Start separate loopback PostgreSQL 15 restore fixture
        run: |
          docker run --detach --name first-release-test-postgres --network host \
            -e POSTGRES_USER=first_release_test \
            -e POSTGRES_PASSWORD=isolated_fr_ci_only \
            -e POSTGRES_DB=core_test_main \
            postgres:15 -c port=55480 -c listen_addresses=127.0.0.1
          for attempt in {1..30}; do
            if docker exec first-release-test-postgres pg_isready -h 127.0.0.1 -p 55480 -U first_release_test -d core_test_main; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 40 first-release-test-postgres
          exit 1
      - name: Install exact PostgreSQL 15 dump and restore clients
        run: |
          sudo apt-get update
          if ! apt-cache show postgresql-client-15 >/dev/null 2>&1; then
            # Official PGDG setup: https://www.postgresql.org/download/linux/ubuntu/
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --show-error --silent \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
              "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/zhiming-pgdg.sources >/dev/null
            sudo apt-get update
          fi
          sudo apt-get install --yes --no-install-recommends postgresql-client-15
          /usr/lib/postgresql/15/bin/pg_dump --version | grep -E 'PostgreSQL\) 15\.'
          /usr/lib/postgresql/15/bin/pg_restore --version | grep -E 'PostgreSQL\) 15\.'
          echo /usr/lib/postgresql/15/bin >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install isolated runtimes
        run: |
          python -m venv --copies "$RUNNER_TEMP/first-release-core-venv"
          "$RUNNER_TEMP/first-release-core-venv/bin/python" -m pip install --require-hashes -r requirements-core.lock -r requirements-test.lock
          echo "$RUNNER_TEMP/first-release-core-venv/bin" >> "$GITHUB_PATH"
          echo "FIRST_RELEASE_CANDIDATE_TEST_PYTHON=$RUNNER_TEMP/first-release-core-venv/bin/python" >> "$GITHUB_ENV"
          python -m venv .chart-venv
          .chart-venv/bin/python -m pip install -r requirements-charts.lock
          echo "CHART_PYTHON=$PWD/.chart-venv/bin/python" >> "$GITHUB_ENV"
          npm ci
      - name: Install and verify the pinned public K3 tokenizer (no model weights)
        run: |
          python -m tools.install_k3_tokenizer --destination "$RUNNER_TEMP/kimi-k3-tokenizer"
          python -m tools.install_k3_tokenizer --destination "$RUNNER_TEMP/kimi-k3-tokenizer" --verify-only
          echo "K3_TOKENIZER_ARTIFACT_DIR=$RUNNER_TEMP/kimi-k3-tokenizer" >> "$GITHUB_ENV"
      - name: Verify loopback PostgreSQL 15
        run: |
          python - <<'PY'
          import os
          from tools.eval.targets.local_db import verify_local_postgres

          verify_local_postgres(os.environ["CORE_TEST_DSN"])
          print("Loopback PostgreSQL 15 verified")
          PY
      - name: Core service and calculator checks
        run: python -m unittest discover -s tests -p 'test_core*.py' -v
      - name: Frontend checks
        run: |
          npm test
          node tests/dom.test.cjs
          node tests/report-settings.dom.test.cjs
          node tests/method-limits.dom.test.cjs
          node --check static/app.js
          npm run build
      - name: v4 clock and evaluation framework
        run: |
          python -m pytest tests/v4 -q
          python tools/eval/runner.py --mode scripted --target fake --self-test
      - name: ModelPort contract and coverage (synthetic transport only)
        run: |
          python -m coverage run --source=mingjing_core.models -m pytest tests/v4/models -q
          python -m coverage report --fail-under=85
          python tools/eval/runner_v2.py --mode scripted --stop-file "$RUNNER_TEMP/night-quota-stop.json" --once-file "$RUNNER_TEMP/night-c2-started.json" --output "$RUNNER_TEMP/eval-c2"
      - name: Stop isolated PostgreSQL
        if: ${{ always() }}
        run: |
          if docker container inspect p0-core-postgres >/dev/null 2>&1; then
            docker rm --force p0-core-postgres
          fi
          if docker container inspect first-release-test-postgres >/dev/null 2>&1; then
            docker rm --force first-release-test-postgres
          fi
