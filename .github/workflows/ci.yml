name: v6 baseline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZHIMING_BASE: ${{ runner.temp }}/zhiming-ci
      ZHIMING_SKILL: ${{ github.workspace }}/hermes
      HERMES_DB: ${{ runner.temp }}/hermes-not-connected.db
      KIMI_API_KEY: ""
      MOONSHOT_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install portable Web test dependencies
        run: python -m pip install fastapi==0.115.12 uvicorn==0.34.3 httpx==0.28.1 Pillow==11.3.0
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check v6 state and API behavior with synthetic data
        run: python -m unittest discover -s tests -p 'test_*v6.py' -v
      - name: Check frontend behavior
        run: npm test
      - name: Check DOM interactions with synthetic rendering fixtures
        run: node tests/dom.test.cjs
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Build frontend styles
        run: npm run build
