id: TM01
title: 相对面试日期按原话时间绝对化
category: memory_recall
clock: '2026-10-17T10:30:00+08:00'
targets:
- v4
seed:
  profile: empty_profile
  synthetic: true
turns:
- user: 我下周三面试
  expect:
    receipts:
    - write_status: saved
    db:
    - kind: fact
      where:
        data.event_at: '2026-10-21'
        data.said_at: '2026-10-15T02:30:00+00:00'
        data.original_expression: 下周三
      count: 1
  at: '2026-10-15T10:30:00+08:00'
- user: 面试是哪天？还有几天？
  expect:
    must_include_all:
    - 10月21日
    - 周三
    - 4天
    tools_called:
    - date_calc
    db:
    - path: observed_tools.0.output.data.result.days
      equals: 4
  at: '2026-10-17T10:30:00+08:00'
scripted:
- turn: 1
  model:
  - tool_call:
      name: memory_write
      arguments:
        message_id: turn-1
        quote: 我下周三面试
        summary: 我下周三面试
        kind: event
  - text: 记下了，10月21日（周三）面试。
- turn: 2
  model:
  - tool_call:
      name: date_calc
      arguments:
        op: diff
        a: '2026-10-17'
        b: '2026-10-21'
  - text: 面试是10月21日，周三，还有4天。
notes: 契约 v2.2：07 附录 B，独立目录，不修改 v2.1 基线；脚本仅给模型文本/工具调用，状态取实际 PG。
