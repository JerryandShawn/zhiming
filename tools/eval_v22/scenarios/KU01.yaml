steps:
- id: step-1
  message:
    id: ku01-old
    role: user
    content: 我在杭州工作，请记住。
    at: '2026-10-03T10:30:00+08:00'
    session_id: ku01-old-web
    channel: web
  expect:
    deterministic:
    - kind: message_recorded
      message_id: ku01-old
    - kind: source_quote
      source_message_id: ku01-old
      quote: 我在杭州工作
      fact_status: active
    - kind: entity_count
      collection: facts
      where:
      - field: source_message_id
        equals: ku01-old
      - field: status
        equals: active
      equals: 1
    semantic:
    - id: acknowledge_original
      criterion: 只确认实际成功的原事实写入，不生成用户未说过的细节。
      evidence:
      - answer
      - persisted_facts
- id: step-2
  message:
    id: ku01-new
    role: user
    content: 我已经搬到上海了，现在也在上海工作，请更新这条记忆。
    at: '2026-10-10T10:30:00+08:00'
    session_id: ku01-update-feishu
    channel: feishu
  expect:
    deterministic:
    - kind: message_recorded
      message_id: ku01-new
    - kind: source_quote
      source_message_id: ku01-new
      quote: 现在也在上海工作
      fact_status: active
    - kind: entity_count
      collection: facts
      where:
      - field: source_message_id
        equals: ku01-old
      - field: status
        equals: active
      equals: 0
    semantic:
    - id: update_current_fact
      criterion: 识别明确更新，旧事实不再作为当前事实，与新事实来源仍可审计。
      evidence:
      - answer
      - persisted_facts
      - source_messages
- id: step-3
  message:
    id: ku01-question
    role: user
    content: 我现在在哪个城市工作？
    at: '2026-10-17T10:30:00+08:00'
    session_id: ku01-review-web
    channel: web
  expect:
    deterministic:
    - kind: message_recorded
      message_id: ku01-question
    semantic:
    - id: use_updated_fact
      criterion: 回答现在在上海工作；杭州只可作为明确的历史对比，不能当作当前城市。
      evidence:
      - answer
      - persisted_facts
      - source_messages
notes:
