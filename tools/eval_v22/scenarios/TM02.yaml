notes:
- 仅未来契约数据定义；未接入 P3 靶标、未验证业务行为、未进行模型评分。
- 必须从原消息执行 memory_write，不能预置 event_at/said_at 或在靶标观测投影中重新计算以冒充存储。
- 纯日期 event_at 保留 YYYY-MM-DD 与日期粒度，不补午夜；含具体时分的时间才按 UTC 存储。
